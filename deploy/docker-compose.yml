# Local demo: http://hr.localtest.me (resolves to 127.0.0.1) -> nginx -> CloudSentinel check -> sample app
services:
  backend:
    build: ..
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      COOKIE_DOMAIN: .localtest.me
    ports: ["8000:8000"]
  sample:
    image: nginx:alpine
  gateway:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["80:80"]
    depends_on: [backend, sample]
