databases:
  - name: cloudsentinel-db
    plan: free
    region: oregon

services:
  - type: web
    name: cloudsentinel-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cloudsentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
